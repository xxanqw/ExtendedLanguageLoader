; ELL four-sheet test setup. Install as GAME/text/languages.ini.
; Requires physical text/american.gxt and text/ukr-ell.gxt.
; ukr-ell.gxt MUST match the generated manifest's byte map. Do not guess
; the source translation's encoding; convert with its actual source map.
; Generated folder: GAME/language-fonts/ukrainian/ExtendedFonts/
; Default generator preset: English + Ukrainian + Russian.
; If using another preset, change Font_encoding to the manifest's encoding.
; Back up your existing INI and saved settings before changing slot order.
[MAIN]
Number_of_languages = 2
Auto_fonts = 0

[Fonts]
ExtendedFonts = true
DebugFonts = true

; Stock English remains vanilla: useful for comparing/fallback testing.
[1]
GXT_language_key = FEL_ENG
GXT_file = american.gxt
Menu_name = English (vanilla)
Script_language = 0
Is_system_metric = 0
Font_profile = keep

; Select this entry in the game's language menu to activate the four sheets.
[2]
GXT_language_key = FEL_UKR
GXT_file = ukr-ell.gxt
Menu_name = Ukrainian (ELL test)
Script_language = 2
Is_system_metric = 1
Font_profile = keep
Font_package = language-fonts/ukrainian/ExtendedFonts
Font_encoding = windows-1251-ukrainian
