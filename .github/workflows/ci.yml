name: Windows build and portable tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Portable source tests (no game assets)
        run: bash test.sh

  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native MSVC Win32 release, tests and size check
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Upload Windows loader-only artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ExtendedLanguageLoader-v0.4.2-windows-x86
          path: dist/ExtendedLanguageLoader-v0.4.2.zip
          if-no-files-found: error
