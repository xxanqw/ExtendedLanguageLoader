name: Windows build and portable tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Portable source tests (no game assets)
        run: bash test.sh

  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Native MSVC Win32 release, tests and size check
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Upload Windows loader-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedLanguageLoader-v0.4.1-windows-x86
          path: dist/ExtendedLanguageLoader-v0.4.1.zip
          if-no-files-found: error
